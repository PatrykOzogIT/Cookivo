<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Cookivo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Cookivo - planuj posiłki pod swoje cele, twórz przepisy i listy zakupów."
    />
    <meta name="theme-color" content="#f8f6ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171f1b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preload" href="fonts/material-symbols-rounded.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Ustaw motyw przed renderem, żeby nie było mignięcia jasnego ekranu.
      try {
        // Dawne "light"/"dark" → Apricot Morning / Cinnamon Night (tak samo w ThemeService)
        var t = localStorage.getItem('ck-theme');
        var map = Object.assign(Object.create(null), {
          light: 'apricot',
          dark: 'cinnamon',
          fresh: 'fresh',
          citrus: 'citrus',
          midnight: 'midnight',
          apricot: 'apricot',
          cinnamon: 'cinnamon',
          contrast: 'contrast',
        });
        if (t && map[t]) document.documentElement.dataset.theme = map[t];
        var l = localStorage.getItem('ck-lang');
        if (l === 'pl' || l === 'en') document.documentElement.lang = l;
      } catch (e) {}
    </script>
    <style>
      /* Ekran startowy pokazuje się dopiero po chwili - przy szybkim starcie nie miga */
      .boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font:
          600 1rem system-ui,
          sans-serif;
        color: var(--ck-text-muted, #526357);
        opacity: 0;
        animation: boot-in 0.3s ease-out 0.4s forwards;
      }
      .boot button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        font: inherit;
        color: var(--ck-cta-text, #fff);
        background: var(--ck-cta-from, #237a53);
        cursor: pointer;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <!-- Do startu aplikacji (Angular podmienia zawartość) - zamiast pustego tła -->
      <div class="boot" role="status">
        <img src="favicon.svg" alt="" width="48" height="48" />
        <span id="boot-text">Ładowanie…</span>
      </div>
    </app-root>
    <script>
      if (document.documentElement.lang === 'en')
        document.getElementById('boot-text').textContent = 'Loading…';
    </script>
  </body>
</html>
