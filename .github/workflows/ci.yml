name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Na main nie przerywamy - nowy push nie może uciąć wdrożenia w połowie wgrywania plików
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: 24

jobs:
  format:
    name: Formatowanie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check

  backend:
    name: Backend (lint, typy, testy) - Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 - wersja deweloperska, 22 - wersja na hostingu (Setup Node.js App)
        node: [22, 24]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cookivo
          POSTGRES_PASSWORD: cookivo
          POSTGRES_DB: cookivo
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U cookivo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Wymagane przez prisma.config.ts (m.in. przy `prisma generate` w postinstall)
      DATABASE_URL: postgresql://cookivo:cookivo@localhost:5433/cookivo?schema=public
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cov
      - run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgresql://cookivo:cookivo@localhost:5433/cookivo_test?schema=public
      - run: npm run build

  frontend:
    name: Frontend (lint, testy, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

  e2e:
    name: E2E + dostępność (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cookivo
          POSTGRES_PASSWORD: cookivo
          POSTGRES_DB: cookivo
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U cookivo" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      CI: true
      DATABASE_URL: postgresql://cookivo:cookivo@localhost:5433/cookivo?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      APP_URL: http://localhost:4200
      HIBP_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci && npm ci --prefix backend && npm ci --prefix frontend
      - run: npm run db:deploy --prefix backend
      - run: npm run db:seed --prefix backend
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Wdrożenie na cookivo.pl: tylko push do main i tylko gdy wszystkie testy są zielone.
  # Hosting bez SSH: pliki przez FTP, restart aplikacji Node (Passenger) przez tmp/restart.txt.
  # Włączane zmienną repozytorium DEPLOY_ENABLED=true (Settings → Secrets and variables → Actions → Variables).
  deploy:
    name: Wdrożenie (cookivo.pl)
    runs-on: ubuntu-latest
    needs: [format, backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # Tylko do `prisma generate` przy instalacji - migracje dostają prawdziwy adres niżej
      DATABASE_URL: postgresql://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Zależności
        run: npm ci --prefix backend && npm ci --prefix frontend

      - name: Build backendu (jeden plik + moduły natywne dla Linuksa)
        working-directory: backend
        run: npm run build && npm run bundle
      - name: Build frontendu
        working-directory: frontend
        run: npm run build

      - name: Migracje i dane startowe (Neon)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
        run: npx prisma migrate deploy && npm run db:seed

      - name: Konfiguracja aplikacji (.env)
        env:
          APP_URL: ${{ vars.APP_URL }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          UPLOADS_DIR: ${{ vars.UPLOADS_DIR }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          set -euo pipefail
          umask 077
          # Wartości w apostrofach (dotenv bierze je dosłownie) - apostrof w środku by to zepsuł
          for name in APP_URL MAIL_FROM UPLOADS_DIR DATABASE_URL JWT_ACCESS_SECRET SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS; do
            if [ -z "${!name}" ]; then echo "::error::Brak wartości $name (sekret lub zmienna środowiska production)"; exit 1; fi
            case "${!name}" in *"'"*) echo "::error::$name nie może zawierać apostrofu"; exit 1;; esac
          done
          secure=false; [ "$SMTP_PORT" = "465" ] && secure=true
          {
            echo "NODE_ENV='production'"
            echo "APP_URL='$APP_URL'"
            echo "DATABASE_URL='$DATABASE_URL'"
            echo "JWT_ACCESS_SECRET='$JWT_ACCESS_SECRET'"
            echo "SMTP_HOST='$SMTP_HOST'"
            echo "SMTP_PORT='$SMTP_PORT'"
            echo "SMTP_SECURE='$secure'"
            echo "SMTP_USER='$SMTP_USER'"
            echo "SMTP_PASS='$SMTP_PASS'"
            echo "MAIL_FROM='$MAIL_FROM'"
            echo "UPLOADS_DIR='$UPLOADS_DIR'"
            echo "HIBP_ENABLED='true'"
            echo "THROTTLE_ENABLED='true'"
          } > backend/deploy/.env

      # Akcja z zewnątrz dostaje hasło FTP - przypięta do konkretnego commita (v4.4.0).
      # `exclude` nadpisuje domyślne wykluczenia akcji (m.in. node_modules - potrzebne w dist/).
      - name: Wgranie backendu (FTP)
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: backend/deploy/
          server-dir: ${{ vars.FTP_BACKEND_DIR }}
          state-name: .ftp-deploy-backend.json
          exclude: |
            tmp/**
      - name: Restart aplikacji Node (tmp/restart.txt)
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: backend/deploy/tmp/
          server-dir: ${{ vars.FTP_BACKEND_DIR }}tmp/
          state-name: .ftp-deploy-restart.json
      - name: Wgranie frontendu (FTP)
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: frontend/dist/frontend/browser/
          server-dir: ${{ vars.FTP_FRONTEND_DIR }}
          exclude: |
            api/**

      - name: Sprawdzenie strony po wdrożeniu
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # Passenger startuje aplikację przy pierwszym żądaniu - dajemy jej chwilę
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "$APP_URL/api/health"
          curl --fail --silent --show-error --output /dev/null "$APP_URL/"
          echo "Wdrożenie działa: $APP_URL"
