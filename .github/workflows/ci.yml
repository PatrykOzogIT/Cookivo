name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Na main nie przerywamy - nowy push nie może uciąć wdrożenia w połowie wgrywania plików
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: 24

jobs:
  format:
    name: Formatowanie
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check

  backend:
    name: Backend (lint, typy, testy) - Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 24 - wersja deweloperska, 22 - wersja na hostingu (Setup Node.js App)
        node: [22, 24]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cookivo
          POSTGRES_PASSWORD: cookivo
          POSTGRES_DB: cookivo
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U cookivo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Wymagane przez prisma.config.ts (m.in. przy `prisma generate` w postinstall)
      DATABASE_URL: postgresql://cookivo:cookivo@localhost:5433/cookivo?schema=public
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Node 22 ma npm 10, który inaczej czyta lockfile z npm 11 (zależności peer) - tylko narzędzie instalacji,
      # na hostingu npm nie jest używany (wgrywamy gotową paczkę)
      - if: matrix.node == 22
        run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cov
      - run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgresql://cookivo:cookivo@localhost:5433/cookivo_test?schema=public
      - run: npm run build

  frontend:
    name: Frontend (lint, testy, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

  e2e:
    name: E2E + dostępność (Playwright) ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    # Obraz z przeglądarkami i bibliotekami systemowymi - bez `playwright install --with-deps` (apt potrafi wisieć).
    # Wersja = @playwright/test z package-lock.json (zmieniać razem).
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        # Testy dzielone na 4 równoległe zadania (każde z własną bazą i serwerami)
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cookivo
          POSTGRES_PASSWORD: cookivo
          POSTGRES_DB: cookivo
        options: >-
          --health-cmd "pg_isready -U cookivo" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
    env:
      CI: true
      # Zadanie działa w kontenerze - usługi pod nazwami, nie localhost
      DATABASE_URL: postgresql://cookivo:cookivo@postgres:5432/cookivo?schema=public
      SMTP_HOST: mailpit
      MAILPIT_URL: http://mailpit:8025
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      APP_URL: http://localhost:4200
      HIBP_ENABLED: 'false'
      HOME: /root
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci && npm ci --prefix backend && npm ci --prefix frontend
      - run: npm run db:deploy --prefix backend
      - run: npm run db:seed --prefix backend
      - run: npx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Wdrożenie (cookivo.pl)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [format, backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # Tylko do `prisma generate` przy instalacji - migracje dostają prawdziwy adres niżej
      DATABASE_URL: postgresql://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@v5
        with:
          # Pełna historia - porównanie z poprzednim pushem (czy zmienił się katalog składników)
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Zależności
        run: npm ci --prefix backend && npm ci --prefix frontend

      - name: Build backendu (jeden plik + moduły natywne dla Linuksa)
        working-directory: backend
        run: npm run build && npm run bundle
      - name: Build frontendu
        working-directory: frontend
        run: npm run build

      - name: Migracje i dane startowe (Neon)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
          BEFORE: ${{ github.event.before }}
          FORCE_SEED: ${{ vars.FORCE_SEED }}
        run: |
          npx prisma migrate deploy
          # Seed tylko, gdy od poprzedniego pushu zmieniły się pliki katalogu (albo nie da się tego sprawdzić,
          # albo zmienna FORCE_SEED=true) - pełny seed w Neon trwa ok. 7 min
          if [ "$FORCE_SEED" = "true" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            || ! git diff --quiet "$BEFORE" HEAD -- prisma/seed; then
            npm run db:seed
          else
            echo "Katalog składników bez zmian - seed pominięty."
          fi

      - name: Konfiguracja aplikacji (.env)
        env:
          APP_URL: ${{ vars.APP_URL }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          UPLOADS_DIR: ${{ vars.UPLOADS_DIR }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Opcjonalne: bez klucza import przepisów ze zdjęć jest wyłączony
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          # Wartości w apostrofach (dotenv bierze je dosłownie) - apostrof w środku by to zepsuł
          for name in APP_URL MAIL_FROM UPLOADS_DIR DATABASE_URL JWT_ACCESS_SECRET SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS; do
            if [ -z "${!name}" ]; then echo "::error::Brak wartości $name (sekret lub zmienna środowiska production)"; exit 1; fi
            case "${!name}" in *"'"*) echo "::error::$name nie może zawierać apostrofu"; exit 1;; esac
          done
          secure=false; [ "$SMTP_PORT" = "465" ] && secure=true
          {
            echo "NODE_ENV='production'"
            echo "APP_URL='$APP_URL'"
            echo "DATABASE_URL='$DATABASE_URL'"
            # Hosting blokuje wychodzący port 5432 - z Neon przez WebSocket (443)
            echo "DB_DRIVER='neon'"
            echo "JWT_ACCESS_SECRET='$JWT_ACCESS_SECRET'"
            echo "SMTP_HOST='$SMTP_HOST'"
            echo "SMTP_PORT='$SMTP_PORT'"
            echo "SMTP_SECURE='$secure'"
            echo "SMTP_USER='$SMTP_USER'"
            echo "SMTP_PASS='$SMTP_PASS'"
            echo "MAIL_FROM='$MAIL_FROM'"
            echo "UPLOADS_DIR='$UPLOADS_DIR'"
            echo "HIBP_ENABLED='true'"
            echo "THROTTLE_ENABLED='true'"
            if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
              case "$ANTHROPIC_API_KEY" in *"'"*) echo "::error::ANTHROPIC_API_KEY nie może zawierać apostrofu" >&2; exit 1;; esac
              echo "ANTHROPIC_API_KEY='$ANTHROPIC_API_KEY'"
            fi
          } > backend/deploy/.env

      # Akcja z zewnątrz dostaje hasło FTP - przypięta do konkretnego commita (v4.4.0).
      # `exclude` nadpisuje domyślne wykluczenia akcji (m.in. node_modules - potrzebne w dist/).
      - name: Wgranie backendu (FTP)
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: backend/deploy/
          server-dir: ${{ vars.FTP_BACKEND_DIR }}
          state-name: .ftp-deploy-backend.json
          exclude: |
            tmp/**
      - name: Restart aplikacji Node (tmp/restart.txt)
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: backend/deploy/tmp/
          server-dir: ${{ vars.FTP_BACKEND_DIR }}tmp/
          state-name: .ftp-deploy-restart.json
      - name: Wgranie frontendu (FTP)
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: frontend/dist/frontend/browser/
          server-dir: ${{ vars.FTP_FRONTEND_DIR }}
          exclude: |
            api/**

      - name: Sprawdzenie strony po wdrożeniu
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # Passenger startuje aplikację przy pierwszym żądaniu - dajemy jej chwilę
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "$APP_URL/api/health"
          curl --fail --silent --show-error --output /dev/null "$APP_URL/"
          echo "Wdrożenie działa: $APP_URL"
